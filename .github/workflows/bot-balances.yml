name: 1.7 Bot wallet balance snapshot

on:
  schedule:
    # Once a day, staggered 20 min after 1.3. Bot balances only move when
    # matches are played, and the game is in maintenance mode, so hourly
    # resolution was recording a flat line 24 times a day.
    - cron: "45 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-balances
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Snapshot bot balances
        env:
          SONEIUM_RPC_URL: ${{ secrets.SONEIUM_RPC_URL }}
        run: node scripts/snapshot-bot-balances.mjs
      - name: Commit data updates
        run: |
          git config user.name "yoki-monitor-bot"
          git config user.email "yoki-monitor-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data(1.7): bot wallet balance snapshot"
            git push
          fi
