name: 1.3 Treasury inflow / outflow walker

on:
  schedule:
    # Once a day, staggered 20 min after 1.2. Outflow alerts are no longer
    # near-real-time: in maintenance mode a same-day notice is the accepted
    # tradeoff for removing the cron noise. The walker chunks getLogs at
    # 5k blocks, so a 24h gap (~43k Soneium blocks) is 9 chunks and stays
    # well inside the job timeout.
    - cron: "25 9 * * *"
  workflow_dispatch:
    inputs:
      initial_block:
        description: "Override starting block (only used when no checkpoint exists; useful for first-run backfill from YokiCores deploy)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: treasury-flow
  cancel-in-progress: false

jobs:
  walk:
    runs-on: ubuntu-latest
    # 20, not 10: a normal 24h gap is ~9 chunks and finishes in seconds, but
    # the checkpoint means a long outage is walked in one catch-up run. A
    # month of skipped ticks is ~260 chunks / ~520 getLogs calls, which can
    # approach 10 min — and that is precisely the run that must not fail.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Walk treasury Transfer events
        env:
          SONEIUM_RPC_URL: ${{ secrets.SONEIUM_RPC_URL }}
          SLACK_WEBHOOK_URL_ALERTS: ${{ secrets.SLACK_WEBHOOK_URL_ALERTS }}
          # Set this variable to "true" until treasury custody owner confirms
          # expected outflow events. Then clear/flip to ship live alerts.
          TREASURY_OUTFLOW_DRY_RUN: ${{ vars.TREASURY_OUTFLOW_DRY_RUN }}
          TREASURY_INITIAL_BLOCK: ${{ inputs.initial_block }}
        run: node scripts/walk-treasury-flow.mjs
      - name: Commit data updates
        run: |
          git config user.name "yoki-monitor-bot"
          git config user.email "yoki-monitor-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data(1.3): treasury flow walk"
            git push
          fi
